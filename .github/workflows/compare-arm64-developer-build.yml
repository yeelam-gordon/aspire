name: Compare ARM64 developer builds
run-name: P49 qualified mature common Csc CPU diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mature_cpu:
    if: >-
      github.repository == 'yeelam-gordon/aspire' &&
      github.ref == 'refs/heads/perf/arm64-mature-cpu-profile' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Checkout owned instrumentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: instrumentation
          persist-credentials: false
      - name: Checkout fixed ordinary product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 06efc928e31486923754398007f4f78003e04ee3
          path: product
          persist-credentials: false
      - name: Native private SDK and offline tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'instrumentation'
          $helper = Join-Path $root 'Generated Files\arm64-build\developer-build\standard-cpu-calibration\mature-csc'
          $evidence = Join-Path $PWD 'mature-cpu-results\evidence'
          try {
            & (Join-Path $helper 'Setup-Hosted.ps1') -InstrumentationRoot $root -RepositoryRoot (Join-Path $PWD 'product') -Evidence $evidence
          }
          catch {
            if (Test-Path $evidence) { $_ | Out-String | Set-Content (Join-Path $evidence 'setup-failure.txt') }
            throw
          }
      - name: One fixed normal compiler lifetime and one qualified CPU build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'instrumentation'
          $helper = Join-Path $root 'Generated Files\arm64-build\developer-build\standard-cpu-calibration\mature-csc'
          $evidence = Join-Path $PWD 'mature-cpu-results\evidence'
          try {
            & (Join-Path $helper 'Invoke-HostedProfile.ps1') `
              -RepositoryRoot (Join-Path $PWD 'product') -SdkRoot (Join-Path $PWD 'product\.dotnet') `
              -ResultsDirectory (Join-Path $evidence 'measurements') -ToolsDirectory (Join-Path $evidence 'tools')
          }
          catch {
            $_ | Out-String | Set-Content (Join-Path $evidence 'profile-failure.txt')
            throw
          }
      - name: Retain controlled raw diagnostics including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mature-cpu-windows-arm64
          path: mature-cpu-results/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
