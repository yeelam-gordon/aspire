name: Compare ARM64 developer builds
run-name: P50 read-only ARM64 activation inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation_inventory:
    if: >-
      github.repository == 'yeelam-gordon/aspire' &&
      github.ref == 'refs/heads/perf/arm64-activation-inventory' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 5
    steps:
      - name: Checkout owned inventory only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read-only activation inventory, fixed help only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD 'Generated Files\arm64-build\developer-build\standard-cpu-calibration\activation-inventory\Invoke-HostedInventory.ps1')
      - name: Retain closed inventory and failed-probe metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation-inventory-windows-arm64
          path: activation-inventory-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
