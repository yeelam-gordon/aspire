name: Compare ARM64 developer builds
run-name: ${{ inputs.native_hosting && 'Capture cold Hosting native CPU' || inputs.profile_hosting && 'Profile cold Hosting managed compilation' || 'Compare ordinary developer builds' }}

# Dedicated manual experiment; not a regular-PR selection target.
on:
  workflow_dispatch:
    inputs:
      profile_hosting:
        description: Profile one cold Hosting compiler build instead of throughput samples
        type: boolean
        default: false
      native_hosting:
        description: Capture one cold Hosting build with WPR or Xcode Time Profiler (diagnostic, not throughput)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    if: >-
      github.repository == 'yeelam-gordon/aspire' &&
      ((github.ref == 'refs/heads/perf/arm64-developer-build' && !inputs.native_hosting) ||
       (github.ref == 'refs/heads/perf/arm64-native-compiler-profile' && inputs.native_hosting && !inputs.profile_hosting))
    name: Developer builds (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-vs2026-arm, macos-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore repository toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64' -or
              [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne 'Arm64') {
            throw 'Both measurements require native ARM64 processes and OS.'
          }
          $evidence = Join-Path $PWD 'developer-build-results'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $entry = if ($IsWindows) { 'restore.cmd' } else { 'restore.sh' }
          # Arcade evaluates explicit project paths from its tooling project;
          # an absolute path works consistently on Windows and macOS.
          $project = Join-Path $PWD 'src/Aspire.Hosting/Aspire.Hosting.csproj'
          if (-not (Test-Path -LiteralPath $project -PathType Leaf)) { throw 'Hosting project is missing.' }
          & (Join-Path $PWD $entry) -configuration Debug -projects $project *> (Join-Path $evidence 'toolchain-restore.log')
          if ($LASTEXITCODE -ne 0) { throw 'Repository toolchain restore failed.' }

      - name: Measure managed developer build cycles
        shell: pwsh
        env:
          PROFILE_HOSTING: ${{ inputs.profile_hosting }}
          NATIVE_HOSTING: ${{ inputs.native_hosting }}
        run: |
          & (Join-Path $PWD 'Generated Files/arm64-build/developer-build/Measure-DeveloperBuild.ps1') `
            -RepositoryRoot $PWD `
            -ResultsDirectory (Join-Path $PWD 'developer-build-results') `
            -ProfileHosting:($env:PROFILE_HOSTING -eq 'true') `
            -NativeHosting:($env:NATIVE_HOSTING -eq 'true')

      - name: Upload developer build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-build-${{ matrix.runner }}
          path: |
            developer-build-results/
            artifacts/log/
          if-no-files-found: error
          retention-days: 7
