name: P08 actual native archive validation
run-name: P08 actual native archives - one Windows and one Mac ARM64 job

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_arm64:
    if: >-
      github.repository == 'yeelam-gordon/aspire' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/perf/dashboard-native-workflow-validation'
    uses: ./.github/workflows/build-cli-native-archives.yml
    with:
      configuration: Release
      targets: '[{"os":"windows-latest","runner":"windows-11-vs2026-arm","rids":"win-arm64"}]'

  macos_arm64:
    if: >-
      github.repository == 'yeelam-gordon/aspire' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/perf/dashboard-native-workflow-validation'
    uses: ./.github/workflows/build-cli-native-archives.yml
    with:
      configuration: Release
      targets: '[{"os":"macos-latest","runner":"macos-latest","rids":"osx-arm64"}]'
