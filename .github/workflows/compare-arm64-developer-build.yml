name: Compare ARM64 developer builds
run-name: Paired ordinary Hosting default compiler warm-up (A-A)

# Existing registered manual workflow path; no PR/push/schedule trigger.
# Dispatch remains subject to a separate parent-owned long-session/audit gate.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform validation scope
        type: choice
        required: true
        default: both
        options: [both, windows, macos]

permissions:
  contents: read

jobs:
  paired_warmup:
    if: >-
      github.repository == 'yeelam-gordon/aspire' &&
      github.ref == 'refs/heads/perf/arm64-compiler-warmup'
    name: Default compiler warm-up (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Default both; focused validation preserves the full per-host workload.
        # An unknown selection has no mapping, never a silent broader fallback.
        runner: ${{ fromJSON('{"both":["windows-11-vs2026-arm","macos-latest"],"windows":["windows-11-vs2026-arm"],"macos":["macos-latest"]}')[inputs.platform] }}
    steps:
      - name: Precreate evidence and ownership epoch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'compiler-warmup-results'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $started = [DateTime]::UtcNow.ToString('O')
          "PAIRED_JOB_START_UTC=$started" >> $env:GITHUB_ENV
          @{
            jobStartUtc = $started
            eventSource = $env:GITHUB_SHA
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            status = 'pre-bootstrap; runner validation not yet established'
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'job-start.json')

      # Existing immutable action pins are unchanged.
      - name: Checkout instrumentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: instrumentation
          persist-credentials: false

      - name: Checkout unchanged product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 06efc928e31486923754398007f4f78003e04ee3
          path: product
          persist-credentials: false

      - name: Restore fresh native repository toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'product'
          $evidence = Join-Path $PWD 'compiler-warmup-results'
          if (Test-Path (Join-Path $root '.dotnet')) {
            throw 'Private SDK must be fresh for job-epoch ownership.'
          }
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64' -or
              [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne 'Arm64') {
            throw 'Both lifetimes require native ARM64 processes and OS.'
          }
          $helper = Join-Path $PWD ([IO.Path]::Combine('instrumentation', 'Generated Files', 'arm64-build', 'developer-build', 'compiler-warmup-paired'))
          . (Join-Path $helper 'Paired-Helpers.ps1')
          $source = (& git -C $root rev-parse HEAD).Trim()
          if (-not (Test-PairedDispatch $env:GITHUB_REPOSITORY $env:GITHUB_REF $env:GITHUB_EVENT_NAME $source)) {
            throw 'Fork/manual/ref/product guard failed.'
          }
          @{
            productSource = $source
            instrumentationSource = (& git -C (Join-Path $PWD 'instrumentation') rev-parse HEAD).Trim()
            bootstrap = 'Project-scoped repository restore; excluded from timing.'
            jobStartUtc = $env:PAIRED_JOB_START_UTC
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'provenance.json')
          $entry = if ($IsWindows) { 'restore.cmd' } else { 'restore.sh' }
          # Preserve P29's macOS fix: Arcade resolves explicit projects from its
          # tooling project, so this path MUST be absolute.
          $project = Join-Path $root ([IO.Path]::Combine('src', 'Aspire.Hosting', 'Aspire.Hosting.csproj'))
          @{
            executable = Join-Path $root $entry
            arguments = @('-configuration', 'Debug', '-projects', $project)
            workingDirectory = $root
            includedInTiming = $false
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'restore-command.json')
          Push-Location $root
          try {
            & (Join-Path $root $entry) -configuration Debug -projects $project *> (Join-Path $evidence 'toolchain-restore.log')
            if ($LASTEXITCODE -ne 0) { throw 'Repository toolchain restore failed.' }
          }
          finally { Pop-Location }

      - name: Pure source fixtures
        shell: pwsh
        run: |
          $helper = Join-Path $PWD ([IO.Path]::Combine('instrumentation', 'Generated Files', 'arm64-build', 'developer-build', 'compiler-warmup-paired'))
          & (Join-Path $helper 'Test-PairedWarmup.ps1') -ResultsDirectory (Join-Path $PWD ([IO.Path]::Combine('compiler-warmup-results', 'source-checks')))

      - name: Build offline reader outside measurement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'product'
          $helper = Join-Path $PWD ([IO.Path]::Combine('instrumentation', 'Generated Files', 'arm64-build', 'developer-build', 'compiler-warmup-paired'))
          $dotnet = Join-Path (Join-Path $root '.dotnet') $(if ($IsWindows) { 'dotnet.exe' } else { 'dotnet' })
          $readerProject = Join-Path $helper ([IO.Path]::Combine('binlog-reader', 'Reader.csproj'))
          $evidence = Join-Path $PWD 'compiler-warmup-results'
          @{
            executable = $dotnet
            arguments = @('build', $readerProject, '--configuration', 'Debug', '--nologo', '/p:UseSharedCompilation=false', '/nr:false')
            workingDirectory = $root
            includedInTiming = $false
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'reader-command.json')
          Push-Location $root
          try {
            # Only the tiny standalone replay utility uses these flags.
            & $dotnet build $readerProject --configuration Debug --nologo /p:UseSharedCompilation=false /nr:false *> (Join-Path $evidence 'reader-build.log')
            if ($LASTEXITCODE -ne 0) { throw 'Offline reader setup build failed.' }
            # Reuse P41's pinned offline decoder, never loaded in the product.
            $library = & (Join-Path $helper 'Get-OfflineDecoder.ps1') -Destination (Join-Path $evidence 'offline-library')
            $traceProject = Join-Path $helper ([IO.Path]::Combine('trace-reader', 'TraceReader.csproj'))
            @{
              executable = $dotnet
              arguments = @('build', $traceProject, '--configuration', 'Debug', '--nologo', '/p:UseSharedCompilation=false', '/nr:false', "/p:TraceEventDirectory=$library")
              includedInTiming = $false
            } | ConvertTo-Json | Set-Content (Join-Path $evidence 'trace-reader-command.json')
            & $dotnet build $traceProject --configuration Debug --nologo /p:UseSharedCompilation=false /nr:false "/p:TraceEventDirectory=$library" *> (Join-Path $evidence 'trace-reader-build.log')
            if ($LASTEXITCODE -ne 0) { throw 'Offline trace decoder setup build failed.' }
          }
          finally { Pop-Location }

      - name: Two default lifetimes then separate diagnostic on this host
        shell: pwsh
        run: |
          $helper = Join-Path $PWD ([IO.Path]::Combine('instrumentation', 'Generated Files', 'arm64-build', 'developer-build', 'compiler-warmup-paired'))
          & (Join-Path $helper 'Measure-PairedWarmup.ps1') `
            -RepositoryRoot (Join-Path $PWD 'product') `
            -ResultsDirectory (Join-Path $PWD ([IO.Path]::Combine('compiler-warmup-results', 'measurements'))) `
            -JobStartUtc ([DateTime]::Parse($env:PAIRED_JOB_START_UTC).ToUniversalTime()) `
            -EditCount 20

      - name: Upload timing and diagnostic gates separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-warmup-${{ matrix.runner }}
          path: |
            compiler-warmup-results/
            product/artifacts/log/
          # Only these controlled evidence roots; never upload the checkout,
          # .git, home or credential directories. Preserve dot-generated files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
