name: Compare ARM64 developer builds
run-name: P49 qualified mature common Csc CPU diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mature_cpu:
    if: >-
      github.repository == 'yeelam-gordon/aspire' &&
      github.ref == 'refs/heads/perf/arm64-mature-cpu-profile' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Checkout owned instrumentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: instrumentation
          persist-credentials: false
      - name: Checkout fixed ordinary product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 06efc928e31486923754398007f4f78003e04ee3
          path: product
          persist-credentials: false
      - name: Native private SDK and offline tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'instrumentation'
          $helper = Join-Path $root 'Generated Files\arm64-build\developer-build\standard-cpu-calibration\mature-csc'
          $evidence = Join-Path $PWD 'mature-cpu-results\evidence'
          . (Join-Path $helper 'Failure.ps1')
          try {
            & (Join-Path $helper 'Setup-Hosted.ps1') -InstrumentationRoot $root -RepositoryRoot (Join-Path $PWD 'product') -Evidence $evidence
          }
          catch {
            $original = $_
            try {
              $null = Write-MatureFailure $original (Join-Path $evidence 'entry-errors') 'hosted-setup' 'primary' @((Join-Path $evidence 'sdk-bootstrap\installer.receipt.json'))
            }
            catch { [Console]::Error.WriteLine("Additional setup reporting failure: $($_.Exception)") }
            throw $original
          }
      - name: One fixed normal compiler lifetime and one qualified CPU build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'instrumentation'
          $helper = Join-Path $root 'Generated Files\arm64-build\developer-build\standard-cpu-calibration\mature-csc'
          $evidence = Join-Path $PWD 'mature-cpu-results\evidence'
          . (Join-Path $helper 'Failure.ps1')
          try {
            & (Join-Path $helper 'Invoke-HostedProfile.ps1') `
              -RepositoryRoot (Join-Path $PWD 'product') -SdkRoot (Join-Path $PWD 'product\.dotnet') `
              -ResultsDirectory (Join-Path $evidence 'measurements') -ToolsDirectory (Join-Path $evidence 'tools')
          }
          catch {
            $original = $_
            try {
              $null = Write-MatureFailure $original (Join-Path $evidence 'entry-errors') 'hosted-profile-entry' 'entrypoint' @((Join-Path $evidence 'measurements\final-state.json'))
            }
            catch { [Console]::Error.WriteLine("Additional profile reporting failure: $($_.Exception)") }
            throw $original
          }
      - name: Stage closed diagnostics and explicitly finalized raw evidence
        id: stage
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $PWD 'instrumentation\Generated Files\arm64-build\developer-build\standard-cpu-calibration\mature-csc'
          & (Join-Path $helper 'Stage-Retention.ps1') `
            -EvidenceRoot (Join-Path $PWD 'mature-cpu-results\evidence') `
            -StageRoot (Join-Path $PWD 'mature-cpu-results\retained')
      # Metadata is a separate finalized artifact BEFORE optional raw upload.
      # A locked/failed collector blob cannot discard the already-closed cause.
      - name: Retain independent closed metadata first
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mature-cpu-metadata-windows-arm64
          path: mature-cpu-results/retained/metadata/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain only staged closed raw archives and manifested outputs
        if: always() && steps.stage.outputs.raw_files_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mature-cpu-raw-windows-arm64
          path: mature-cpu-results/retained/raw/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
